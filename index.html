<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Monitoring System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Mainscreen -->
    <div class="card">

        <!-- Title -->
        <div class="header">
            <img src="ZAMECO LOGO.png" alt="ZAMECO I Logo" class="logo">
            <h2>Zambales I Electric Cooperative, Inc.</h2>
        </div>
        <h1>Fuel Monitoring</h1>

        <!-- Date and Municipality selection -->
        <label>Date</label> <input type="text" id="date" readonly>
        <label>Municipality</label> 
        <select id="municipality">
            <option value="">Select Municipality</option>
            <option>STA CRUZ</option>
            <option>CANDELARIA</option>
            <option>MASINLOC</option>
            <option>PALAUIG</option>
            <option>IBA</option>
            <option>BOTOLAN</option>
        </select>

        <div class="gps">
            Latitude: <span id="lat">...</span><br>
            Longitude: <span id="lng">...</span>
        </div>

        <div class="preview" id="preview">No image captured</div>
        <button onclick="openCamera()">📷 Capture Photo</button>

        <button id="uploadBtn" onclick="uploadPhoto()" disabled>
            ⬆ Upload Photo
        </button>

        <input type="file" id="camera" accept="image/*" capture="environment" hidden>
        <div id="status" class="status"></div>

    </div>

<script>
    // IMPORTANT: REPLACE THIS WITH YOUR OWN DEPLOYED SCRIPT URL FOR GDRIVE BACKEND
    const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxMVwW15HoqBwTnI7Oin5QyeSMTyXKSOWbD2KTznImRLyBUN22cqOhhiowI0qrQ86ZqHw/exec";

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("date").value = today;

    let lat = "";
    let lng = "";

    let selectedFile = null;
    let selectedBase64 = null;

    navigator.geolocation.getCurrentPosition(
    pos => {
        lat = pos.coords.latitude;
        lng = pos.coords.longitude;
        document.getElementById("lat").innerText = lat;
        document.getElementById("lng").innerText = lng;
    },
    err => {
        document.getElementById("lat").innerText = "N/A";
        document.getElementById("lng").innerText = "N/A";
    }
    );

    function openCamera(){
        document.getElementById("camera").click();
    }

    document.getElementById("camera").addEventListener("change", function(e){

        const file = e.target.files[0];

        if(!file) return;

        selectedFile = file;

        document.getElementById("preview").innerHTML =
        `<img src="${URL.createObjectURL(file)}" style="max-width:100%;">`;

        const reader = new FileReader();

        reader.onload = function(){

            selectedBase64 = reader.result.split(",")[1];

            document.getElementById("status").innerHTML =
            "Photo captured. Click Upload Photo.";

            document.getElementById("uploadBtn").disabled = false;
        };

        reader.readAsDataURL(file);

    });

    function uploadPhoto(){

        if(!selectedFile || !selectedBase64){
            alert("Capture a photo first.");
            return;
        }

        const municipality =
        document.getElementById("municipality").value;

        document.getElementById("uploadBtn").disabled = true;

        document.getElementById("status").innerHTML =
        "<span class='loading'>Uploading...</span>";

        fetch(SCRIPT_URL, {
            method: "POST",
            body: new URLSearchParams({
                municipality,
                dateFolder: today,
                fileName: selectedFile.name,
                mimeType: selectedFile.type,
                base64Data: selectedBase64,
                latitude: lat,
                longitude: lng
            })
        })

        .then(async res => {

            const text = await res.text();

            console.log("RAW RESPONSE:", text);

            return JSON.parse(text);
        })

        .then(data => {

            if(data.success){

                document.getElementById("status").innerHTML =
                "<span class='success'>Uploaded: " +
                data.message +
                "</span>";

                selectedFile = null;
                selectedBase64 = null;

            }else{

                document.getElementById("status").innerHTML =
                "<span class='error'>" +
                data.message +
                "</span>";

                document.getElementById("uploadBtn").disabled = false;
            }

        })

        .catch(err => {

            console.error(err);

            document.getElementById("status").innerHTML =
            "<span class='error'>Upload failed</span>";

            document.getElementById("uploadBtn").disabled = false;

        });

    }

</script>

</body>
</html>
