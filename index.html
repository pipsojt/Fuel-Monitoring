<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Monitoring System</title>

<link rel="stylesheet" href="style.css">

<style>
.preview{
    margin:15px 0;
    text-align:center;
    border:1px solid #ddd;
    padding:10px;
    border-radius:8px;
}

.preview img{
    width:100%;
    max-width:300px;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

#uploadBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status{
    margin-top:15px;
    font-weight:bold;
}

.loading{
    color:orange;
}

.success{
    color:green;
}

.error{
    color:red;
}

.gps{
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">

    <div class="header">
        <img src="ZAMECO LOGO.png" alt="ZAMECO I Logo" class="logo">
        <h2>Zambales I Electric Cooperative, Inc.</h2>
    </div>

    <h1>Fuel Monitoring</h1>

    <label>Date</label>
    <input type="text" id="date" readonly>

    <label>Municipality</label>
    <select id="municipality">
        <option value="">Select Municipality</option>
        <option>STA CRUZ</option>
        <option>CANDELARIA</option>
        <option>MASINLOC</option>
        <option>PALAUIG</option>
        <option>IBA</option>
        <option>BOTOLAN</option>
    </select>

    <div class="gps">
        Latitude: <span id="lat">Loading...</span><br>
        Longitude: <span id="lng">Loading...</span>
    </div>

    <div id="preview" class="preview">
        No image captured
    </div>

    <button type="button" onclick="openCamera()">
        📷 Capture Photo
    </button>

    <button
        type="button"
        id="uploadBtn"
        onclick="uploadPhoto()"
        disabled>
        ⬆ Upload Photo
    </button>

    <input
        type="file"
        id="camera"
        accept="image/*"
        capture="environment"
        hidden>

    <div id="status" class="status"></div>

</div>

<script>

//================================================
// APPS SCRIPT WEB APP URL
//================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxMVwW15HoqBwTnI7Oin5QyeSMTyXKSOWbD2KTznImRLyBUN22cqOhhiowI0qrQ86ZqHw/exec";

//================================================
// TODAY'S DATE
//================================================

const today = new Date().toISOString().split("T")[0];
document.getElementById("date").value = today;

//================================================
// VARIABLES
//================================================

let latitude = "";
let longitude = "";

let selectedFile = null;
let selectedBase64 = null;

//================================================
// GPS LOCATION
//================================================

navigator.geolocation.getCurrentPosition(

    function(position){

        latitude = position.coords.latitude;
        longitude = position.coords.longitude;

        document.getElementById("lat").textContent = latitude;
        document.getElementById("lng").textContent = longitude;
    },

    function(error){

        console.error("GPS Error:", error);

        document.getElementById("lat").textContent = "N/A";
        document.getElementById("lng").textContent = "N/A";
    }

);

//================================================
// OPEN CAMERA
//================================================

function openCamera(){

    const municipality =
    document.getElementById("municipality").value;

    if(!municipality){

        alert("Please select municipality first.");
        return;
    }

    document.getElementById("camera").click();
}

//================================================
// CAPTURE IMAGE
//================================================

document.getElementById("camera")
.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    console.log("Selected File:", file.name);
    console.log("File Size:", file.size);

    selectedFile = file;

    document.getElementById("preview").innerHTML =
        `<img src="${URL.createObjectURL(file)}" alt="Preview">`;

    const reader = new FileReader();

    reader.onload = function(){

        selectedBase64 =
            reader.result.split(",")[1];

        console.log(
            "Base64 Length:",
            selectedBase64.length
        );

        document.getElementById("status").innerHTML =
            "Photo ready for upload.";

        document.getElementById("uploadBtn")
            .disabled = false;
    };

    reader.readAsDataURL(file);

});

//================================================
// UPLOAD PHOTO
//================================================

async function uploadPhoto(){

    if(!selectedFile){

        alert("Please capture a photo first.");
        return;
    }

    const municipality =
    document.getElementById("municipality").value;

    const uploadBtn =
    document.getElementById("uploadBtn");

    uploadBtn.disabled = true;

    document.getElementById("status").innerHTML =
        "<span class='loading'>Uploading...</span>";

    try{

        const response = await fetch(
            SCRIPT_URL,
            {
                method:"POST",
                body:new URLSearchParams({

                    municipality: municipality,

                    dateFolder: today,

                    fileName: selectedFile.name,

                    mimeType: selectedFile.type,

                    base64Data: selectedBase64,

                    latitude: latitude,

                    longitude: longitude
                })
            }
        );

        const text =
            await response.text();

        console.log(
            "RAW SERVER RESPONSE:",
            text
        );

        const data =
            JSON.parse(text);

        if(data.success){

            document.getElementById("status").innerHTML =
                `<span class="success">${data.message}</span>`;

            selectedFile = null;
            selectedBase64 = null;

        }else{

            document.getElementById("status").innerHTML =
                `<span class="error">${data.message}</span>`;

            uploadBtn.disabled = false;
        }

    }
    catch(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );

        document.getElementById("status").innerHTML =
            `<span class="error">
                Upload failed.<br>
                ${error.message}
            </span>`;

        uploadBtn.disabled = false;
    }
}

</script>

</body>
</html>
